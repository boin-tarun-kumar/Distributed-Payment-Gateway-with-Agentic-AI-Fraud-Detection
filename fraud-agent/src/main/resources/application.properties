server.port=${SERVER_PORT:8084}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DATABASE_USERNAME:payments}
spring.datasource.password=${DATABASE_PASSWORD:local-dev-only}
spring.sql.init.mode=always
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=fraud-agent
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.paymentgateway.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.paymentgateway.events.FraudInvestigateEvent
spring.kafka.consumer.max-poll-records=250
spring.kafka.consumer.fetch-min-size=65536
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.batch-size=65536
spring.kafka.producer.buffer-memory=67108864
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.compression.type=lz4
spring.datasource.hikari.maximum-pool-size=${FRAUD_DB_MAX_POOL:32}
spring.datasource.hikari.minimum-idle=${FRAUD_DB_MIN_IDLE:8}
spring.datasource.hikari.connection-timeout=2000
settlement-service.base-url=${SETTLEMENT_SERVICE_URL:http://localhost:8086}
fraud.ai.base-url=${FRAUD_AI_BASE_URL:http://localhost:11434}
fraud.ai.model=${FRAUD_AI_MODEL:llama3.1}
fraud.velocity.review-threshold=${FRAUD_VELOCITY_REVIEW_THRESHOLD:10}
fraud.history.decline-hold-threshold=${FRAUD_HISTORY_DECLINE_HOLD_THRESHOLD:5}
