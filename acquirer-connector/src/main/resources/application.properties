server.port=${SERVER_PORT:8083}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=acquirer-connector
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.async-acks=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.paymentgateway.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.paymentgateway.events.SagaCommand
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.fetch-min-size=65536
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.batch-size=65536
spring.kafka.producer.buffer-memory=67108864
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.compression.type=lz4
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${ACQUIRER_REDIS_MAX_ACTIVE:128}
spring.data.redis.lettuce.pool.max-idle=${ACQUIRER_REDIS_MAX_IDLE:64}
spring.data.redis.lettuce.pool.min-idle=${ACQUIRER_REDIS_MIN_IDLE:16}
spring.data.redis.lettuce.pool.max-wait=100ms
server.netty.connection-timeout=2s
server.netty.idle-timeout=60s
acquirer.simulation.latency-ms=${ACQUIRER_SIMULATION_LATENCY_MS:20}
acquirer.simulation.failure=${ACQUIRER_SIMULATION_FAILURE:false}
