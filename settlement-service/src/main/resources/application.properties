server.port=${SERVER_PORT:8086}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DATABASE_USERNAME:payments}
spring.datasource.password=${DATABASE_PASSWORD:local-dev-only}
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=${SETTLEMENT_DB_MAX_POOL:32}
spring.datasource.hikari.minimum-idle=${SETTLEMENT_DB_MIN_IDLE:8}
spring.datasource.hikari.connection-timeout=2000
settlement.cron=${SETTLEMENT_CRON:0 0 2 * * *}
settlement.zone=${SETTLEMENT_TIME_ZONE:UTC}
settlement.processing-fee-rate=${SETTLEMENT_PROCESSING_FEE_RATE:0.029}
settlement.processing-fee-fixed=${SETTLEMENT_PROCESSING_FEE_FIXED:0.30}
