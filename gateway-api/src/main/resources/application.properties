server.port=${SERVER_PORT:8080}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.batch-size=65536
spring.kafka.producer.buffer-memory=67108864
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.producer.properties.enable.idempotence=true
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${GATEWAY_REDIS_MAX_ACTIVE:128}
spring.data.redis.lettuce.pool.max-idle=${GATEWAY_REDIS_MAX_IDLE:64}
spring.data.redis.lettuce.pool.min-idle=${GATEWAY_REDIS_MIN_IDLE:16}
spring.data.redis.lettuce.pool.max-wait=100ms
server.netty.connection-timeout=2s
server.netty.idle-timeout=60s
gateway.http.max-connections=${GATEWAY_HTTP_MAX_CONNECTIONS:1024}
gateway.http.pending-acquires=${GATEWAY_HTTP_PENDING_ACQUIRES:10000}
gateway.http.response-timeout-ms=${GATEWAY_HTTP_RESPONSE_TIMEOUT_MS:5000}
payment-orchestrator.base-url=${PAYMENT_ORCHESTRATOR_URL:http://localhost:8082}
gateway.velocity.window-ms=${GATEWAY_VELOCITY_WINDOW_MS:1000}
gateway.velocity.suspicious-threshold=${GATEWAY_VELOCITY_SUSPICIOUS_THRESHOLD:10}
gateway.velocity.block-threshold=${GATEWAY_VELOCITY_BLOCK_THRESHOLD:30}
