server.port=${SERVER_PORT:8082}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DATABASE_USERNAME:payments}
spring.datasource.password=${DATABASE_PASSWORD:local-dev-only}
spring.sql.init.mode=always
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-orchestrator
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.paymentgateway.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.paymentgateway.events.SagaReply
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.fetch-min-size=65536
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.batch-size=65536
spring.kafka.producer.buffer-memory=67108864
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.compression.type=lz4
spring.datasource.hikari.maximum-pool-size=${ORCHESTRATOR_DB_MAX_POOL:64}
spring.datasource.hikari.minimum-idle=${ORCHESTRATOR_DB_MIN_IDLE:16}
spring.datasource.hikari.connection-timeout=2000
payment.outbox.poll-interval-ms=${PAYMENT_OUTBOX_POLL_INTERVAL_MS:500}
payment.saga.recovery-poll-ms=${PAYMENT_SAGA_RECOVERY_POLL_MS:15000}
