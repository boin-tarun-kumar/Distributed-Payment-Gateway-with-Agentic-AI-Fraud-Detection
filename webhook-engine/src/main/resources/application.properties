server.port=${SERVER_PORT:8085}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DATABASE_USERNAME:payments}
spring.datasource.password=${DATABASE_PASSWORD:local-dev-only}
spring.datasource.hikari.maximum-pool-size=${WEBHOOK_DB_MAX_POOL:32}
spring.datasource.hikari.minimum-idle=${WEBHOOK_DB_MIN_IDLE:8}
spring.datasource.hikari.connection-timeout=2000
spring.sql.init.mode=always
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=webhook-engine
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.fetch-min-size=65536
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.paymentgateway.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.paymentgateway.events.PaymentEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.batch-size=65536
spring.kafka.producer.buffer-memory=67108864
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.producer.properties.enable.idempotence=true
webhook.http.max-connections=${WEBHOOK_HTTP_MAX_CONNECTIONS:512}
webhook.http.pending-acquires=${WEBHOOK_HTTP_PENDING_ACQUIRES:10000}
webhook.http.response-timeout-ms=${WEBHOOK_HTTP_RESPONSE_TIMEOUT_MS:5000}
webhook.delivery.timeout-ms=${WEBHOOK_DELIVERY_TIMEOUT_MS:5000}
webhook.scheduler.poll-ms=${WEBHOOK_SCHEDULER_POLL_MS:250}
webhook.scheduler.batch-size=${WEBHOOK_SCHEDULER_BATCH_SIZE:200}
webhook.scheduler.concurrency=${WEBHOOK_SCHEDULER_CONCURRENCY:64}
